<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tempo">
  <defs>
    <linearGradient id="grad-clock" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="55%" stop-color="#168CFF"/>
      <stop offset="100%" stop-color="#20D6F4"/>
    </linearGradient>
  </defs>
  
  <!-- Fundo arredondado -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#071225" stroke="#29476E" stroke-width="1.5"/>
  
  <!-- Relógio/ampulheta estilizado -->
  <g fill="none" stroke="url(#grad-clock)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Círculo externo do relógio -->
    <circle cx="32" cy="32" r="16" stroke-width="3"/>
    
    <!-- Marcas de hora -->
    <path d="M32 18 L32 22" opacity="0.6"/>
    <path d="M32 42 L32 46" opacity="0.6"/>
    <path d="M18 32 L22 32" opacity="0.6"/>
    <path d="M42 32 L46 32" opacity="0.6"/>
    
    <!-- Ponteiros (mostrando tempo passando) -->
    <path d="M32 32 L32 24" stroke-width="3"/> <!-- ponteiro das horas -->
    <path d="M32 32 L38 36" stroke-width="2.5"/> <!-- ponteiro dos minutos -->
    
    <!-- Centro -->
    <circle cx="32" cy="32" r="3" fill="url(#grad-clock)" stroke="none"/>
  </g>
  
  <!-- Efeito de brilho -->
  <circle cx="32" cy="32" r="8" fill="url(#grad-clock)" opacity="0.15"/>
</svg>