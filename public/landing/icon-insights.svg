<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Inteligência">
  <defs>
    <linearGradient id="grad-insights" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="55%" stop-color="#168CFF"/>
      <stop offset="100%" stop-color="#20D6F4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fundo arredondado -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#071225" stroke="#29476E" stroke-width="1.5"/>
  
  <!-- Cérebro/Rede neural estilizado -->
  <g fill="none" stroke="url(#grad-insights)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Círculo central (núcleo) -->
    <circle cx="32" cy="32" r="8" stroke-width="3"/>
    
    <!-- Conexões superiores -->
    <path d="M32 24 L32 14" opacity="0.9"/>
    <path d="M26 26 L18 18" opacity="0.7"/>
    <path d="M38 26 L46 18" opacity="0.7"/>
    
    <!-- Conexões laterais -->
    <path d="M24 32 L14 32" opacity="0.8"/>
    <path d="M40 32 L50 32" opacity="0.8"/>
    
    <!-- Conexões inferiores -->
    <path d="M26 38 L20 46" opacity="0.6"/>
    <path d="M38 38 L44 46" opacity="0.6"/>
    <path d="M32 40 L32 50" opacity="0.9"/>
    
    <!-- Nós externos (pontos de dados) -->
    <circle cx="32" cy="14" r="3" fill="url(#grad-insights)" stroke="none"/>
    <circle cx="18" cy="18" r="2.5" fill="url(#grad-insights)" stroke="none" opacity="0.8"/>
    <circle cx="46" cy="18" r="2.5" fill="url(#grad-insights)" stroke="none" opacity="0.8"/>
    <circle cx="14" cy="32" r="3" fill="url(#grad-insights)" stroke="none"/>
    <circle cx="50" cy="32" r="3" fill="url(#grad-insights)" stroke="none"/>
    <circle cx="20" cy="46" r="2.5" fill="url(#grad-insights)" stroke="none" opacity="0.7"/>
    <circle cx="44" cy="46" r="2.5" fill="url(#grad-insights)" stroke="none" opacity="0.7"/>
    <circle cx="32" cy="50" r="3" fill="url(#grad-insights)" stroke="none"/>
  </g>
  
  <!-- Linha de dados no centro (representando análise) -->
  <g stroke="url(#grad-insights)" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M28 32 L30 30 L34 34 L36 32" stroke-dasharray="2 2"/>
  </g>
  
  <!-- Efeito de brilho no núcleo -->
  <circle cx="32" cy="32" r="4" fill="url(#grad-insights)" opacity="0.3" filter="url(#glow)"/>
</svg>